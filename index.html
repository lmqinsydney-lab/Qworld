<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>房间改造 · v0.3</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;background:#000;font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;color:#fff;overflow:hidden;}
  .app{position:fixed;inset:0;max-width:480px;margin:0 auto;background:#0c0c0d;overflow:hidden;}
  .screen{position:absolute;inset:0;display:none;flex-direction:column;}
  .screen.active{display:flex;}
  .sa-top{padding-top:max(20px,env(safe-area-inset-top));}
  .sa-bot{padding-bottom:max(18px,env(safe-area-inset-bottom));}
  .body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}

  .accent{color:#1ed760;}
  .btn{height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;border:none;width:100%;}
  .btn-green{background:#1ed760;color:#000;}
  .btn-dim{background:#1c1c1e;color:#6a6a70;}
  .btn-gold{background:linear-gradient(135deg,#e7c989,#caa15a);color:#2a1e08;}

  /* ===== onboarding ===== */
  #onb .head{display:flex;align-items:center;justify-content:space-between;padding:8px 22px 0;}
  #onb .dots{display:flex;gap:6px;}
  #onb .dots i{width:22px;height:4px;border-radius:3px;background:#2a2a2e;}
  #onb .dots i.on{background:#1ed760;}
  #onb .skip{font-size:12px;color:#8a8a90;}
  #onb .q{font-size:24px;font-weight:800;letter-spacing:-.5px;padding:30px 22px 6px;line-height:1.3;}
  #onb .hint{font-size:12px;color:#9a9aa0;padding:0 22px 16px;}
  #onb .opts{padding:6px 18px;display:flex;flex-direction:column;gap:10px;}
  .opt{padding:16px 18px;border-radius:14px;background:#161618;border:1.5px solid #232327;font-size:14px;font-weight:600;color:#d8d8de;display:flex;align-items:center;justify-content:space-between;}
  .opt.sel{border-color:#1ed760;background:rgba(30,215,96,.1);color:#fff;}
  .opt .ck{width:18px;height:18px;border-radius:50%;border:1.5px solid #3a3a40;flex-shrink:0;}
  .opt.sel .ck{background:#1ed760;border-color:#1ed760;}
  #onb .foot{padding:14px 22px;}

  /* ===== home ===== */
  #home{overflow:hidden;}
  #home #auroraCanvas{position:absolute;inset:0;width:100%!important;height:100%!important;opacity:.6;pointer-events:none;z-index:0;}
  #home::before{content:"";position:absolute;top:0;left:0;right:0;height:160px;background:linear-gradient(180deg,rgba(8,8,10,.78) 0%,rgba(8,8,10,0) 100%);z-index:1;pointer-events:none;}
  #home .topbar{position:relative;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:8px 22px 0;}
  /* 品牌 logo:发光胶囊 + 胶囊小屋/Capsule Home */
  .brand{display:flex;align-items:center;gap:10px;}
  .brand svg{filter:drop-shadow(0 0 7px rgba(64,232,150,.7));}
  .brand .bt{display:flex;flex-direction:column;line-height:1.2;}
  .brand .bt .cn{font-size:16px;font-weight:800;letter-spacing:2px;}
  .brand .bt .en{font-size:9px;color:#9a9aa2;font-weight:600;letter-spacing:1.6px;margin-top:1px;}
  /* 标题移到 3D 小屋下方、卡片左上方 */
  #home .hometitle{position:relative;z-index:3;padding:8px 18px 12px;}
  #home .hometitle .t{font-size:24px;font-weight:800;letter-spacing:-.5px;cursor:pointer;display:inline-flex;align-items:center;}
  #home .hometitle .t .caret{font-size:14px;margin-left:4px;color:#1ed760;}
  .hxwrap{position:relative;}
  .hxmenu{position:absolute;top:100%;left:0;margin-top:8px;min-width:140px;background:rgba(28,28,32,.98);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.5);opacity:0;transform:translateY(-6px);pointer-events:none;transition:.16s;z-index:20;}
  .hxmenu.open{opacity:1;transform:translateY(0);pointer-events:auto;}
  .hxopt{font-size:14px;padding:10px 14px;border-radius:10px;color:#d8d8dc;cursor:pointer;}
  .hxopt:active{background:rgba(255,255,255,.06);}
  .hxopt.on{color:#1ed760;font-weight:700;background:rgba(30,215,96,.1);}
  .gear{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;}
  .house3d{position:relative;z-index:2;height:300px;min-height:300px;margin-top:2px;}
  #houseCanvas{display:block;width:100%;height:100%;touch-action:none;}
  #home .homescroll{position:relative;z-index:2;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  #home .homescroll::-webkit-scrollbar{display:none;}
  #home .cards{position:relative;z-index:2;padding:0 18px 8px;display:flex;flex-direction:column;gap:14px;}
  #home .cards>*{flex-shrink:0;}   /* 关键:卡片不被弹性压扁,否则三/四居室时客厅大卡会塌成 0 高 */
  .rcard{position:relative;border-radius:20px;cursor:pointer;}
  .rcard.big{height:260px;margin-top:14px;}        /* 单行(仅大卡)时保持原高 */
  .rcard.big.compact{height:200px;}                /* 有小卡时(两行/三行)压到 200px */
  .rcard.small{height:120px;}
  .rcard .bg{position:absolute;inset:0;border-radius:20px;overflow:hidden;background-size:cover;background-position:center;background-color:#17171b;}
  .rcard .bg.empty{background:rgba(255,255,255,.08);}
  .rcard .scrim{position:absolute;inset:0;border-radius:20px;background:none;pointer-events:none;}
  /* 点亮(有照片)的卡片:四周黑色渐变遮罩,让标签与文字更醒目 */
  .rcard.haspic .scrim{background:
    radial-gradient(125% 115% at 50% 42%, rgba(0,0,0,0) 48%, rgba(0,0,0,.5) 100%),
    linear-gradient(180deg, rgba(0,0,0,.42) 0%, rgba(0,0,0,0) 26%, rgba(0,0,0,0) 52%, rgba(0,0,0,.72) 100%);}
  .rcard .name{position:absolute;left:16px;bottom:14px;z-index:3;display:inline-flex;align-items:center;gap:7px;font-size:19px;font-weight:800;letter-spacing:-.3px;text-shadow:0 1px 6px rgba(0,0,0,.55);}
  .rcard.small .name{font-size:15px;left:13px;bottom:11px;gap:6px;}
  /* 标题旁小灯 icon:暗 / 亮 */
  .rcard .name .lampi{display:inline-flex;flex:0 0 auto;color:#8b8b92;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5));}
  .rcard .name .lampi.on{color:#ffd089;filter:drop-shadow(0 0 5px rgba(255,170,80,.8));}
  /* 未点亮:仅居中 + 号(无外圈) */
  .rcard .addbtn{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);z-index:3;display:flex;align-items:center;justify-content:center;color:#d6d6dc;opacity:.5;filter:drop-shadow(0 1px 4px rgba(0,0,0,.45));}
  .rcard:not(.lit) .name{opacity:1;}
  .rcard .addbtn svg{width:46px;height:46px;}
  .rcard.small .addbtn{top:44%;}
  .rcard.small .addbtn svg{width:38px;height:38px;}
  /* 已点亮卡片:四周淡淡暖光晕 */
  .rcard.lit{box-shadow:0 0 0 1px rgba(255,201,128,.22),0 0 22px rgba(255,168,72,.26),0 6px 26px rgba(0,0,0,.42);}
  .rcard .tag{position:absolute;left:14px;top:14px;z-index:3;font-size:10px;font-weight:700;padding:4px 10px;border-radius:20px;}
  .rcard .tag.lit{background:rgba(30,215,96,.92);color:#04300f;}
  .rcard .tag.ren{background:linear-gradient(135deg,rgba(231,201,137,.96),rgba(202,161,90,.96));color:#2a1e08;}
  .rcard .elem{position:absolute;z-index:4;pointer-events:none;filter:drop-shadow(0 8px 14px rgba(0,0,0,.45));}
  .rcard .elem.elem-big{width:172px;top:-40px;left:50%;transform:translateX(-50%);}
  .rcard .elem.elem-small{width:62px;right:10px;bottom:8px;}
  #home .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  #home .grid .span2{grid-column:span 2;}
  #home .tip{position:relative;z-index:2;text-align:left;font-size:11px;color:#7a7a80;padding:8px 18px 2px;}

  /* ===== detail ===== */
  /* 详情页:全屏顶图 hero + 悬浮圆形返回按钮(与首页右上角 gear 同款) */
  #detail .dback{position:absolute;top:max(14px,env(safe-area-inset-top));left:16px;z-index:30;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.08);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .dhero{position:relative;width:100%;}
  .dhero-scrim{position:absolute;left:0;right:0;bottom:0;height:62%;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.5) 52%,#000 100%);}
  .dhero-name{position:absolute;left:0;right:0;bottom:18px;z-index:5;pointer-events:none;text-align:center;font-size:26px;font-weight:800;letter-spacing:-.5px;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.55);}
  .photo{margin:0;border-radius:0;height:340px;background-size:cover;background-position:center;position:relative;overflow:hidden;}
  .photo .badge{position:absolute;top:12px;left:12px;font-size:11px;padding:5px 12px;border-radius:30px;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);}
  .photo .badge.gold{background:linear-gradient(135deg,rgba(231,201,137,.92),rgba(202,161,90,.92));color:#2a1e08;font-weight:700;}
  .photo .acts{position:absolute;top:max(14px,env(safe-area-inset-top));right:14px;display:flex;gap:8px;z-index:6;}
  .photo .chip{font-size:11px;font-weight:600;color:#fff;padding:6px 12px;border-radius:30px;background:rgba(0,0,0,.52);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);}
  .photo .load{position:absolute;inset:0;background:rgba(8,8,10,.66);backdrop-filter:blur(3px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
  .spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.18);border-top-color:#1ed760;animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .load .lt{font-size:12px;color:#cfe8d6;}
  .upbox{margin:0 18px;border:2px dashed #3a4a40;border-radius:20px;height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:radial-gradient(100% 100% at 50% 0%,#16241b,#0e0e0f);}
  .upbox .t{font-size:14px;font-weight:700;}
  .upbox .h{font-size:12px;color:#8a9a8e;}
  .upbox .pick{margin-top:6px;padding:10px 22px;border-radius:30px;background:#1ed760;color:#000;font-size:14px;font-weight:700;}
  .sec-t{font-size:14px;font-weight:700;padding:22px 20px 10px;display:flex;align-items:center;justify-content:space-between;}
  .sec-t .sub{font-size:11px;font-weight:500;color:#8a8a90;}
  /* 详情页主 tab:改造攻略 / 找灵感 */
  .dtabs{display:flex;gap:24px;padding:18px 20px 0;border-bottom:1px solid #232327;}
  .dtab{position:relative;font-size:15px;font-weight:700;color:#7a7a80;padding:0 0 12px;cursor:pointer;transition:color .15s;}
  .dtab.on{color:#fff;}
  .dtab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2.5px;border-radius:2px;background:#1ed760;}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding:0 20px 4px;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex-shrink:0;font-size:12px;padding:8px 14px;border-radius:30px;background:#232527;color:#c9c9cf;border:1px solid #2e3032;}
  .tab.on{background:#fff;color:#000;font-weight:700;border-color:#fff;}
  .cases{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 20px 6px;}
  .case{width:auto;height:132px;border-radius:14px;background-size:cover;background-position:center;position:relative;overflow:hidden;border:1px solid #232327;}
  .case .lay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.7));}
  .case .cap{position:absolute;left:10px;bottom:8px;font-size:11px;font-weight:700;}
  .case .go{position:absolute;right:8px;top:8px;font-size:10px;background:rgba(30,215,96,.92);color:#04300f;font-weight:800;padding:3px 8px;border-radius:20px;}
  #detail .foot,#result .foot{padding:14px 18px;}

  /* ===== result ===== */
  .rhero{margin:0 18px;border-radius:20px;height:236px;background-size:cover;background-position:center;position:relative;overflow:hidden;}
  .rhero .tag{position:absolute;top:12px;left:12px;font-size:11px;padding:5px 12px;border-radius:30px;background:linear-gradient(135deg,rgba(231,201,137,.92),rgba(202,161,90,.92));color:#2a1e08;font-weight:700;}
  .ba{margin:16px 18px 0;position:relative;height:220px;border-radius:18px;overflow:hidden;touch-action:none;user-select:none;}
  .ba .layer{position:absolute;inset:0;background-size:cover;background-position:center;}
  .ba .before{clip-path:inset(0 50% 0 0);}
  .ba .lbl{position:absolute;bottom:10px;font-size:10px;font-weight:700;padding:4px 10px;border-radius:20px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);}
  .ba .lbl.l{left:10px;} .ba .lbl.r{right:10px;}
  .ba .handle{position:absolute;top:0;bottom:0;left:50%;width:2px;background:#fff;box-shadow:0 0 8px rgba(0,0,0,.6);}
  .ba .grip{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:#111;font-size:13px;font-weight:800;box-shadow:0 2px 10px rgba(0,0,0,.5);}
  /* 详情页顶部用的对比滑块:尺寸/圆角对齐原 .photo */
  .ba.dba{margin:0;height:340px;border-radius:0;}
  .ba .acts{position:absolute;top:max(14px,env(safe-area-inset-top));right:14px;display:flex;gap:8px;z-index:6;}
  .ba .chip{font-size:11px;font-weight:600;color:#fff;padding:6px 12px;border-radius:30px;background:rgba(0,0,0,.52);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);cursor:pointer;}
  .clist{padding:18px 18px 0;}
  .card{background:#141416;border:1px solid #232327;border-radius:16px;padding:16px;margin-bottom:12px;}
  .card .ch{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;}
  .card .cd{font-size:13px;color:#b8b8be;line-height:1.7;margin-top:8px;}
  .items{display:flex;flex-direction:column;gap:9px;margin-top:10px;}
  .items .it{display:flex;align-items:center;gap:10px;font-size:13px;color:#dcdce2;}
  .items .it .dot{width:6px;height:6px;border-radius:50%;background:#1ed760;flex-shrink:0;}
  .sw{display:flex;gap:10px;margin-top:12px;}
  .sw .s{flex:1;height:48px;border-radius:10px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font-size:9px;color:rgba(255,255,255,.9);font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.5);}
  .card.lock{opacity:.55;border-style:dashed;}
  .card.lock .soon{font-size:10px;background:#232327;color:#9a9aa0;padding:3px 9px;border-radius:20px;}
  .card.hero{border-color:rgba(202,161,90,.5);background:linear-gradient(135deg,rgba(202,161,90,.14),rgba(20,20,22,.6));}

  /* ===== toast ===== */
  #toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%) translateY(20px);background:rgba(20,28,22,.95);border:1px solid rgba(30,215,96,.4);color:#dff5e6;font-size:13px;font-weight:600;padding:11px 20px;border-radius:30px;z-index:99;opacity:0;transition:.28s;pointer-events:none;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="app">

  <!-- ========== ONBOARDING ========== -->
  <div class="screen active sa-top sa-bot" id="onb">
    <div class="head">
      <div class="dots" id="onbDots"></div>
      <div class="skip" onclick="finishOnb()">跳过</div>
    </div>
    <div class="body">
      <div class="q" id="onbQ"></div>
      <div class="hint" id="onbHint"></div>
      <div class="opts" id="onbOpts"></div>
    </div>
    <div class="foot"><button class="btn btn-green" id="onbNext" onclick="onbNextStep()">下一步</button></div>
  </div>

  <!-- ========== HOME ========== -->
  <div class="screen sa-top sa-bot" id="home">
    <canvas id="auroraCanvas"></canvas>
    <div class="topbar">
      <div class="brand">
        <svg width="26" height="38" viewBox="0 0 36 52" fill="none">
          <rect x="3" y="3" width="30" height="46" rx="15" stroke="#3fe896" stroke-width="3"/>
          <path d="M7.5 27 L18 16.5 L28.5 27" stroke="#3fe896" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="15.5" y="28.5" width="5" height="5" rx="1" fill="#aef3d2"/>
          <path d="M4 38 H32" stroke="#3fe896" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <div class="bt"><span class="cn">胶囊小屋</span><span class="en">CAPSULE HOME</span></div>
      </div>
      <div class="gear" onclick="go('onb')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="#fff" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
    </div>
    <div class="homescroll" id="homeScroll">
      <div class="house3d" id="house3d"><canvas id="houseCanvas"></canvas></div>
      <div class="hometitle hxwrap">
        <div class="t" onclick="toggleHxMenu(event)">我的家 · <span id="hxLabel">两居室</span><span class="caret">▾</span></div>
        <div class="hxmenu" id="hxMenu"></div>
      </div>
      <div class="cards" id="cardsWrap"></div>
    </div>
  </div>

  <!-- ========== ROOM DETAIL ========== -->
  <div class="screen sa-bot" id="detail">
    <div class="dback" onclick="go('home')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="body" id="dBody"></div>
    <div class="foot" id="dFoot"></div>
  </div>

  <div id="toast"></div>
  <input type="file" id="fileInput" accept="image/*" style="display:none">
</div>

<script>
/* ===================== 数据 ===================== */
const STYLES=['中古风','现代简约','北欧','日式 Japandi','奶油法式','工业风'];
const HUXING=['卧室','单间','一居室','两居室','三居室','四居室'];

// 风格指纹(原型用):一句话解读 + 调色板(驱动小屋上色 & 配色块) + 关键单品
const FP={
  '中古风':   {desc:'胡桃木 + 焦糖橙,复古又暖,租房也能做出腔调。',pal:['#a8623a','#c89b6a','#3f5a4e'],items:['胡桃木电视柜/边几','焦糖色绒面单人椅','黄铜细杆落地灯','几何纹中古地毯','龟背竹大绿植']},
  '现代简约': {desc:'高级灰 + 一点原木,干净利落不显乱。',pal:['#7d828a','#c2c6cc','#b9a07f'],items:['布艺直排沙发','原木方几','极简筒形落地灯','素色棉麻窗帘','黑铁洞洞置物架']},
  '北欧':     {desc:'奶白 + 浅木 + 雾蓝,松弛又通透。',pal:['#d8c7ad','#eee7da','#8aa0a6'],items:['浅木腿布沙发','藤编收纳筐','纸艺球吊灯','短绒奶油地毯','尤加利干花']},
  '日式 Japandi':{desc:'原木 + 米灰,禅意留白,适合小空间。',pal:['#a4906f','#d9cbb3','#5c5142'],items:['矮脚实木床架','亚麻米色床品','和纸落地灯','粗陶花器','无印风层架']},
  '奶油法式': {desc:'奶油白 + 燕麦 + 复古金,温柔氛围感。',pal:['#e7d6bd','#f3ead9','#c9a37a'],items:['奶油弧形沙发','法式复古边柜','金边圆镜','羊羔绒抱枕','蜡烛氛围灯']},
  '工业风':   {desc:'水泥灰 + 做旧皮,硬朗有型。',pal:['#7a7e82','#b0987f','#3a3c3e'],items:['做旧皮沙发','铁艺管架','爱迪生吊灯','水泥纹地毯','金属收纳箱']},
};

/* 首页左上角:切换户型 */
function toggleHxMenu(e){
  e&&e.stopPropagation();
  const m=document.getElementById('hxMenu');
  m.classList.toggle('open');
}
function renderHxMenu(){
  const m=document.getElementById('hxMenu');
  m.innerHTML=HUXING.map(h=>`<div class="hxopt${h===curHuxing?' on':''}" onclick="switchHuxing('${h}')">${h}</div>`).join('');
}
function switchHuxing(h){
  document.getElementById('hxMenu').classList.remove('open');

/* ===================== 首页卡片 ===================== */
/* 标题旁的小灯 icon:暗(未点亮)/ 亮(已点亮) */
const LAMP_OFF_SVG=`<svg viewBox="0 0 24 24" width="15" height="15" fill="none" aria-hidden="true"><path d="M9.5 18.5h5M10.5 21h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M12 3.2a5.8 5.8 0 0 0-3.4 10.5c.5.4.8.9.9 1.5l.1.6h4.8l.1-.6c.1-.6.4-1.1.9-1.5A5.8 5.8 0 0 0 12 3.2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
const LAMP_ON_SVG=`<svg viewBox="0 0 24 24" width="15" height="15" fill="none" aria-hidden="true"><path d="M9.5 18.5h5M10.5 21h3" stroke="#ffd089" stroke-width="1.6" stroke-linecap="round"/><path d="M12 3.2a5.8 5.8 0 0 0-3.4 10.5c.5.4.8.9.9 1.5l.1.6h4.8l.1-.6c.1-.6.4-1.1.9-1.5A5.8 5.8 0 0 0 12 3.2Z" fill="#ffb454" fill-opacity=".92" stroke="#ffe0a8" stroke-width="1.3" stroke-linejoin="round"/></svg>`;

function cardHTML(r,big,span,compact){
  const lit = r.state!=='empty';                          // 已点亮(含焕新)
  const bg  = r.state==='empty' ? '' : (r.state==='renovated'?r.result:r.orig);
  const cls=(big?'rcard big'+(compact?' compact':''):'rcard small')
    +(span?' span2':'')+(bg?' haspic':'')+(lit?' lit':'');
  // 中心元素:未点亮=上传 + 号;焕新=点睛单品;已点亮=照片本身(无中心元素)
  let center='';
  if(r.state==='empty'){
    center=`<div class="addbtn" aria-label="上传照片"><svg viewBox="0 0 24 24" width="24" height="24" fill="none"><path d="M12 5.5v13M5.5 12h13" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></div>`;
  }
  // 焕新态不再展示点睛单品的图片(只保留卡片照片 + 标签)
  // 焕新保留点睛单品标签;已点亮不再显示「已点亮」角标(改用标题旁小灯)
  const tag = r.state==='renovated' ? `<div class="tag ren">✨ ${r.hero||'已焕新'}</div>` : '';
  const lamp = big ? `<span class="lampi ${lit?'on':'off'}">${lit?LAMP_ON_SVG:LAMP_OFF_SVG}</span>` : '';   // 小灯 icon 仅大卡显示
  return `<div class="${cls}" onclick="openRoom('${r.name}')">
    <div class="bg ${bg?'':'empty'}" ${bg?`style="background-image:url('${bg}')"`:''}></div>
    <div class="scrim"></div>${tag}${center}
    <div class="name">${lamp}<span class="nm">${r.name}</span></div>
  </div>`;
}
function renderHome(){
  const list=Object.entries(rooms).map(([n,r])=>({name:n,...r}));
  const big=list[0], smalls=list.slice(1);
  const compact=smalls.length>0;   // 有小卡(两行/三行)时大卡压到 200px
  let html = big?cardHTML(big,true,false,compact):'';
  if(smalls.length){
    html += `<div class="grid">`+smalls.map((r,i)=>cardHTML(r,false,(smalls.length%2===1)&&(i===smalls.length-1))).join('')+`</div>`;
  }
  document.getElementById('cardsWrap').innerHTML=html;
  document.getElementById('hxLabel').textContent=curHuxing;
  renderHxMenu();
}

/* ===================== 详情页 ===================== */
let currentRoom=null, detailStyle=null, detailTab='guide';  // detailTab: 'guide'(改造攻略) | 'inspo'(找灵感)
function orderedStyles(){ return [...userStyles, ...STYLES.filter(s=>!userStyles.includes(s))]; }

function openRoom(name){
  currentRoom=name;
  const r=rooms[name];
  // 首次点击(空状态):直接调起上传,上传后进入详情页;
  // 已上传/已焕新再点 => 进入房间详情页
  if(r.state==='empty'){ pickPhoto(); return; }
  detailStyle = r.style || orderedStyles()[0];
  detailTab='guide';            // 进入详情默认看「改造攻略」

  go('detail');
}

function renderDetail(){
  const name=currentRoom, r=rooms[name];
  const heroExtra=`<div class="dhero-scrim"></div><div class="dhero-name">我的${name}</div>`;

  if(r.state==='empty'){

        <div class="t">上传${name}照片</div><div class="h">拍一张,或从相册选</div>

    const acts=`<div class="acts"><div class="chip" onclick="replacePhoto()" onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()">更换照片</div></div>`;

function renderLower(){

function applyStyle(){
  const r=rooms[currentRoom];
  if(r.state==='empty'){ toast('请先上传'+currentRoom+'照片'); return; }
  // 模拟「即梦」保结构换软装的生成过程
  const photo=document.getElementById('dPhoto');
  if(photo){ photo.insertAdjacentHTML('beforeend',`<div class="load"><div class="spin"></div><div class="lt">AI 正在按「${detailStyle}」焕新…保结构,只换软装</div></div>`); }
  setTimeout(()=>{
    r.state='renovated'; r.style=detailStyle; r.result=RESULT_IMG[detailStyle]||r.orig;
    r.hero=HERO[detailStyle]||'点睛单品'; r.heroImg='assets/elements/hero.svg';  // 提炼核心单品 → 上首页卡片
    detailTab='guide';            // 焕新后切回改造攻略,展示同步过来的改造结果
    renderHome(); renderDetail();
    toast(`焕新完成 ✨ 点睛单品「${r.hero}」已上首页`);
  },1300);
}

function pickPhoto(){
  const inp=document.getElementById('fileInput');
  inp.onchange=()=>{
    const file=inp.files[0]; if(!file) return;
    const url=URL.createObjectURL(file);
    rooms[currentRoom].orig=url; rooms[currentRoom].state='lit';
    detailStyle = rooms[currentRoom].style || orderedStyles()[0];
    detailTab='guide';                              // 上传后默认进「改造攻略」
    renderHome(); renderDetail(); go('detail');      // 进入房间详情页
    inp.value=''; toast('已点亮 · 这是你的改造攻略');
  };
  inp.click();
}

// 原图随时可替换:换张照片 → 回到「点亮」待焕新(旧的焕新结果作废)
function replacePhoto(){
  const inp=document.getElementById('fileInput');
  inp.onchange=()=>{
    const file=inp.files[0]; if(!file) return;
    const url=URL.createObjectURL(file);
    const r=rooms[currentRoom];
    r.orig=url; r.state='lit'; r.result=''; r.style=null; r.hero=null; r.heroImg=null;
    renderHome(); renderDetail(); inp.value=''; toast('照片已更新 · 重新挑个灵感焕新');
  };
  inp.click();
}

/* 结果页已并入详情页「改造攻略」(焕新后),不再单独保留。
   改造前后对比滑块按 class 取元素 → 同一页面可存在多个实例互不冲突。
   extra=附加 class(如 'dba' 详情页顶部尺寸);acts=右上角操作按钮 HTML(可选)。*/
function baHTML(beforeImg, afterImg, extra, acts){
  return `<div class="ba ${extra||''}">
    <div class="layer after" style="background-image:url('${afterImg}')"></div>
    <div class="layer before" style="background-image:url('${beforeImg}')"></div>
    <div class="lbl l">改造前</div><div class="lbl r">改造后</div>
    <div class="handle"><div class="grip">⇄</div></div>
    ${acts||''}
  </div>`;
}
function initBA(ba){
  if(!ba) return;
  const before=ba.querySelector('.layer.before'), handle=ba.querySelector('.handle');
  if(!before||!handle) return;
  let drag=false;
  const set=clientX=>{const rc=ba.getBoundingClientRect();let p=(clientX-rc.left)/rc.width;p=Math.max(0,Math.min(1,p));before.style.clipPath=`inset(0 ${(100-p*100).toFixed(1)}% 0 0)`;handle.style.left=(p*100).toFixed(1)+'%';};
  const start=e=>{drag=true;set((e.touches?e.touches[0]:e).clientX);};
  const move=e=>{if(drag)set((e.touches?e.touches[0]:e).clientX);};
  const end=()=>{drag=false;};
  ba.addEventListener('mousedown',start);ba.addEventListener('touchstart',start,{passive:true});
  window.addEventListener('mousemove',move);ba.addEventListener('touchmove',move,{passive:true});
  window.addEventListener('mouseup',end);ba.addEventListener('touchend',end);
}

/* ===================== onboarding ===================== */
const ONB=[

const AURORA_STOPS=['#2f6b3a','#1ed760','#caa15a'];
let auroraGL=null,auroraProg=null,auroraU={},auroraActive=false;const auroraT0=performance.now();
function hexv(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16)/255,parseInt(h.slice(2,4),16)/255,parseInt(h.slice(4,6),16)/255];}
function initAurora(){
  const canvas=document.getElementById('auroraCanvas');
  const gl=canvas.getContext('webgl2',{alpha:true,premultipliedAlpha:true,antialias:true});
  if(!gl){return;}
  auroraGL=gl;
  const VERT=`#version 300 es
in vec2 position;
void main(){ gl_Position=vec4(position,0.0,1.0); }`;
  const FRAG=`#version 300 es
precision highp float;
uniform float uTime; uniform float uAmplitude; uniform vec3 uColorStops[3];
uniform vec2 uResolution; uniform float uBlend; out vec4 fragColor;
vec3 permute(vec3 x){ return mod(((x*34.0)+1.0)*x,289.0); }
float snoise(vec2 v){
  const vec4 C=vec4(0.211324865405187,0.366025403784439,-0.577350269189626,0.024390243902439);
  vec2 i=floor(v+dot(v,C.yy)); vec2 x0=v-i+dot(i,C.xx);
  vec2 i1=(x0.x>x0.y)?vec2(1.0,0.0):vec2(0.0,1.0);
  vec4 x12=x0.xyxy+C.xxzz; x12.xy-=i1; i=mod(i,289.0);
  vec3 p=permute(permute(i.y+vec3(0.0,i1.y,1.0))+i.x+vec3(0.0,i1.x,1.0));
  vec3 m=max(0.5-vec3(dot(x0,x0),dot(x12.xy,x12.xy),dot(x12.zw,x12.zw)),0.0);
  m=m*m; m=m*m;
  vec3 x=2.0*fract(p*C.www)-1.0; vec3 h=abs(x)-0.5; vec3 ox=floor(x+0.5); vec3 a0=x-ox;
  m*=1.79284291400159-0.85373472095314*(a0*a0+h*h);
  vec3 g; g.x=a0.x*x0.x+h.x*x0.y; g.yz=a0.yz*x12.xz+h.yz*x12.yw;
  return 130.0*dot(m,g);

struct ColorStop{ vec3 color; float position; };
#define COLOR_RAMP(colors,factor,finalColor){ int index=0; for(int i=0;i<2;i++){ ColorStop currentColor=colors[i]; bool isInBetween=currentColor.position<=factor; index=int(mix(float(index),float(i),float(isInBetween))); } ColorStop currentColor=colors[index]; ColorStop nextColor=colors[index+1]; float range=nextColor.position-currentColor.position; float lerpFactor=(factor-currentColor.position)/range; finalColor=mix(currentColor.color,nextColor.color,lerpFactor); }
void main(){
  vec2 uv=gl_FragCoord.xy/uResolution;
  ColorStop colors[3];
  colors[0]=ColorStop(uColorStops[0],0.0);
  colors[1]=ColorStop(uColorStops[1],0.5);
  colors[2]=ColorStop(uColorStops[2],1.0);
  vec3 rampColor; COLOR_RAMP(colors,uv.x,rampColor);
  float height=snoise(vec2(uv.x*2.0+uTime*0.1,uTime*0.25))*0.5*uAmplitude;
  height=exp(height); height=(uv.y*2.0-height+0.2);
  float intensity=0.6*height; float midPoint=0.20;
  float auroraAlpha=smoothstep(midPoint-uBlend*0.5,midPoint+uBlend*0.5,intensity);
  vec3 auroraColor=intensity*rampColor;
  fragColor=vec4(auroraColor*auroraAlpha,auroraAlpha);
}`;
  function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.warn('aurora shader:',gl.getShaderInfoLog(s));return s;}
  const prog=gl.createProgram();
  gl.attachShader(prog,sh(gl.VERTEX_SHADER,VERT));
  gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FRAG));
  gl.linkProgram(prog); auroraProg=prog; gl.useProgram(prog);
  const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(prog,'position');
  gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  ['uTime','uAmplitude','uColorStops','uResolution','uBlend'].forEach(n=>auroraU[n]=gl.getUniformLocation(prog,n));
  gl.clearColor(0,0,0,0); gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
  auroraResize(); requestAnimationFrame(auroraLoop);
}
function auroraResize(){
  if(!auroraGL)return;
  const c=auroraGL.canvas,host=document.getElementById('home');
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const w=(host.clientWidth||window.innerWidth),h=(host.clientHeight||window.innerHeight);
  c.width=Math.max(1,w*dpr); c.height=Math.max(1,h*dpr);
  auroraGL.viewport(0,0,c.width,c.height);
}
function auroraLoop(t){
  requestAnimationFrame(auroraLoop);
  if(!auroraGL||!auroraActive)return;
  const gl=auroraGL; gl.useProgram(auroraProg);
  gl.uniform1f(auroraU.uTime,(t-auroraT0)*0.001);
  gl.uniform1f(auroraU.uAmplitude,1.0);
  gl.uniform1f(auroraU.uBlend,0.6);
  gl.uniform2f(auroraU.uResolution,gl.canvas.width,gl.canvas.height);
  const flat=[]; AURORA_STOPS.forEach(s=>flat.push(...hexv(s)));
  gl.uniform3fv(auroraU.uColorStops,new Float32Array(flat));
  gl.clear(gl.COLOR_BUFFER_BIT); gl.drawArrays(gl.TRIANGLES,0,3);
}
window.addEventListener('resize',auroraResize);

    const rim=(i,j,al)=>glowLine(v[i],v[j],{line:P.rim,glow:P.rim},A(al),1.4*DPR,5*DPR);
    rim(7,6,0.85); rim(4,7,0.78);
    if(!adj(R,'-z',all)) rim(4,5,0.9);
    if(!adj(R,'+x',all)) rim(5,6,0.9);
  }
  function wsolid(ox,oz,lx,ly,lz,w,h,d,pal,a,thick,glowR,faceA,glow){
    const x=ox+lx,z=oz+lz,y=ly;
    const fa=(faceA==null?a:faceA);
    const v=[[x-w/2,y,z-d/2],[x+w/2,y,z-d/2],[x+w/2,y,z+d/2],[x-w/2,y,z+d/2],
             [x-w/2,y+h,z-d/2],[x+w/2,y+h,z-d/2],[x+w/2,y+h,z+d/2],[x-w/2,y+h,z+d/2]].map(p=>project(...p));
    fillFace(v,[3,2,6,7],pal.face,fa*0.55);   // 侧面
    fillFace(v,[1,2,6,5],pal.face,fa*0.72);   // 正面
    fillFace(v,[4,5,6,7],pal.face,fa*0.95);   // 顶面最亮
    // 完整立体描边(读得出是实体家具),体积感交给面
    if(glow===false) EDG.forEach(([i,j])=>plainLine(v[i],v[j],pal,a*0.95,thick));
    else             EDG.forEach(([i,j])=>glowLine(v[i],v[j],pal,a*0.95,thick,glowR));
    return v;
  }
  function puddle(cx,cz,r,pal,inten,t,seed){
    const p=project(cx,0.02,cz),rr=Math.max(8,r*p.s),pulse=0.78+0.22*Math.sin(t*0.0018+seed);
    ctx.globalCompositeOperation='lighter';
    const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,rr);
    g.addColorStop(0,`rgba(${pal.win.r},${pal.win.g},${pal.win.b},${inten*0.55*pulse})`);
    g.addColorStop(0.6,`rgba(${pal.win.r},${pal.win.g},${pal.win.b},${inten*0.14})`);
    g.addColorStop(1,`rgba(${pal.win.r},${pal.win.g},${pal.win.b},0)`);
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,rr,0,7);ctx.fill();
    ctx.globalCompositeOperation='source-over';
  }
  function drawFurniture(kind,cx,cz,wx,wz,pal,a,faceA,glow,t){
    const hwx=wx/2,hwz=wz/2;
    const F=(lx,ly,lz,w,h,d,aa)=>wsolid(cx,cz,lx,ly,lz,w,h,d,pal,aa,1.6*DPR,6*DPR,faceA,glow);
    // 精简件数,但每类保留标志性剪影,靠轮廓认出来
    if(kind==='living'){
      F(0,0,hwz*0.32, wx*0.62,0.18,wz*0.30, a);          // 沙发坐垫(矮宽)
      F(0,0.18,hwz*0.46, wx*0.62,0.22,wz*0.07, a);       // 沙发靠背(标志)
      F(0,0,-hwz*0.42, wx*0.34,0.10,wz*0.18, a*0.85);    // 茶几(矮)
    }else if(kind==='study'){
      F(0,0,-hwz*0.42, wx*0.56,0.16,wz*0.24, a);         // 书桌(薄桌面)
      F(-hwx*0.62,0,0, wx*0.12,0.62,wz*0.52, a);         // 书架(高,标志)
    }else if(kind==='game'){
      F(0,0,-hwz*0.42, wx*0.58,0.16,wz*0.22, a);         // 电脑桌(薄桌面)
      F(0,0,hwz*0.14, wx*0.24,0.18,wz*0.22, a);          // 椅座
      F(0,0.18,hwz*0.24, wx*0.24,0.34,0.05, Math.min(1,a+.1)); // 椅背(高,标志)
    }else{
      const bw=wx*0.54,bd=wz*0.66;
      F(0,0,0, bw,0.16,bd, a);                            // 床(矮宽平台)
      F(0,0.16,-bd/2+0.04, bw,0.30,0.06, a*0.95);         // 床头板(标志)
    }
  }
  function drawRoom(name,R,all,t){
    const sp=SPEC[name], state=(rooms[name]||{}).state||'empty', st=styleOf(state), pal=st.pal;
    const breath=0.82+0.18*Math.sin(t*0.0013+R.x0*1.3);
    const v=rectVerts(R,WALL_H).map(p=>project(...p));
    const c=rcenter(R), wx=R.x1-R.x0, wz=R.z1-R.z0;
    // 统一用毛玻璃外壳:未点亮=中性灰 / 点亮=暖 / 焕新=暖且更亮
    const SH = state==='empty'?SH_NEUTRAL : (state==='renovated'?SH_WARM_BRIGHT:SH_WARM);
    drawShellFrosted(R,v,all,SH);
    // 点亮/焕新:地面透出暖光(光池)
    if(st.win>0) puddle(c.x,c.z,Math.min(wx,wz)*0.62,pal,st.win,t,R.x0);
    drawFurniture(sp.kind,c.x,c.z,wx,wz,pal,st.furn*breath,st.faceA*breath,st.furnGlow,t);
  }
  /* 房间小板:展示房间名 + 状态(未点亮显示"未点亮",点亮/焕新只显示名) */
  function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
  function drawLabels(L,names){
    ctx.globalCompositeOperation='source-over';
    // 远的先画、近的后画(近的盖在上面)
    const items=names.map(n=>{const c=rcenter(L[n]);return{n,p:project(c.x,WALL_H+0.34,c.z)};})
                     .sort((a,b)=>b.p.depth-a.p.depth);
    items.forEach(({n,p})=>{
      const state=(rooms[n]||{}).state||'empty';
      const status=state==='empty'?'未点亮':'';
      const nameF=11*DPR, stF=9*DPR, padX=10*DPR, padY=6*DPR, gap=3*DPR;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.font=`700 ${nameF}px -apple-system,system-ui,sans-serif`;
      const nameW=ctx.measureText(n).width;
      let stW=0; if(status){ctx.font=`500 ${stF}px -apple-system,system-ui,sans-serif`; stW=ctx.measureText(status).width;}
      const w=Math.max(nameW,stW)+padX*2;
      const h=nameF+(status?stF+gap:0)+padY*2;
      const x=p.x-w/2, y=p.y-h/2;
      ctx.fillStyle='rgba(16,18,26,0.6)'; rrect(x,y,w,h,8*DPR); ctx.fill();
      ctx.lineWidth=1*DPR; ctx.strokeStyle='rgba(255,255,255,0.16)'; ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,0.96)';
      ctx.font=`700 ${nameF}px -apple-system,system-ui,sans-serif`;
      const nameY=status?(y+padY+nameF/2):p.y;
      ctx.fillText(n,p.x,nameY);
      if(status){
        ctx.fillStyle='rgba(178,188,208,0.85)';
        ctx.font=`500 ${stF}px -apple-system,system-ui,sans-serif`;
        ctx.fillText(status,p.x,nameY+nameF/2+gap+stF/2);
      }
    });
  }
  function drawGround(){const N=9,span=6.2;ctx.lineWidth=1*DPR;
    for(let i=-N;i<=N;i++){const tt=i/N*span;
      const a1=project(tt,0,-span),a2=project(tt,0,span),b1=project(-span,0,tt),b2=project(span,0,tt);
      ctx.strokeStyle=`rgba(${GROUND},0.07)`;
      ctx.beginPath();ctx.moveTo(a1.x,a1.y);ctx.lineTo(a2.x,a2.y);ctx.stroke();
      ctx.beginPath();ctx.moveTo(b1.x,b1.y);ctx.lineTo(b2.x,b2.y);ctx.stroke();}
  }
  const motes=[];for(let i=0;i<26;i++)motes.push({x:Math.random(),y:Math.random(),s:5+Math.random()*12,sp:0.2+Math.random()*0.6,a:0.06+Math.random()*0.26,ph:Math.random()*6});
  function drawMotes(t){ctx.globalCompositeOperation='lighter';
    motes.forEach(m=>{let y=(m.y-(t*0.0000045*m.sp*60))%1;if(y<0)y+=1;
      const x=(m.x+Math.sin(t*0.0005+m.ph)*0.02)*W,py=y*H,a=m.a*(0.5+0.5*Math.sin(t*0.001+m.ph));
      ctx.globalAlpha=a;ctx.drawImage(sprite,x-m.s*DPR,py-m.s*DPR,m.s*2*DPR,m.s*2*DPR);});
    ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';}

  /* 渲染循环:实时读取全局 rooms */
  let autoRot=true, baseYaw=cam.yaw, swayT=0;
  function frame(t){
    if(autoRot){swayT+=0.005; cam.yaw=baseYaw+Math.sin(swayT)*0.12;}
    ctx.clearRect(0,0,W,H);
    drawMotes(t); drawGround();
    const names=(typeof rooms==='object'&&rooms?Object.keys(rooms):[]).filter(n=>SPEC[n]);
    if(names.length){
      const L=layout(names), all=Object.values(L);
      const order=names.map(n=>{const c=rcenter(L[n]);return{n,d:project(c.x,WALL_H/2,c.z).depth};}).sort((a,b)=>b.d-a.d);
      order.forEach(o=>drawRoom(o.n,L[o.n],all,t));
      drawLabels(L,names);
    }
    requestAnimationFrame(frame);
  }

  /* 交互:拖动旋转 / 点房间进详情 */
  let drag=false,lx=0,moved=0,dX=0,dY=0,lastTouch=0;
  const lxy=(cx,cy)=>{const r=cv.getBoundingClientRect();return [cx-r.left, cy-r.top];};
  function hit(sx,sy){
    const names=Object.keys(rooms).filter(n=>SPEC[n]); if(!names.length)return;
    const L=layout(names);let best=null,bd=1e9;
    names.forEach(n=>{const c=rcenter(L[n]),p=project(c.x,WALL_H/2,c.z);
      const d=Math.hypot(p.x/DPR-sx,p.y/DPR-sy);if(d<bd){bd=d;best=n;}});
    if(best&&bd<88&&typeof openRoom==='function') openRoom(best);
  }
  function down(cx,cy){drag=true;const[x,y]=lxy(cx,cy);lx=x;dX=x;dY=y;moved=0;autoRot=false;}
  function move(cx){if(!drag)return;const r=cv.getBoundingClientRect();const x=cx-r.left;cam.yaw+=(x-lx)*0.006;baseYaw=cam.yaw;moved+=Math.abs(x-lx);lx=x;}
  // 用起止净位移判断"点击 vs 拖拽":手机点按常有轻微滑动,阈值放宽到 12px,避免点房间被误判为旋转而无法触发上传
  function up(cx,cy){if(!drag)return;drag=false;const[x,y]=lxy(cx,cy);if(Math.hypot(x-dX,y-dY)<12)hit(x,y);setTimeout(()=>autoRot=true,2500);}
  // 触屏后浏览器会补发一组模拟 mouse 事件 → 会让 down/up 跑第二遍,导致 openRoom/pickPhoto 二次触发把选图流程搞乱。
  // 用 lastTouch 时间戳在触屏后 700ms 内屏蔽这些模拟鼠标事件。
  const fromTouch=()=>Date.now()-lastTouch<700;
  cv.addEventListener('mousedown',e=>{if(fromTouch())return;down(e.clientX,e.clientY);});
  window.addEventListener('mousemove',e=>{if(fromTouch())return;move(e.clientX);});
  window.addEventListener('mouseup',e=>{if(fromTouch())return;up(e.clientX,e.clientY);});
  cv.addEventListener('touchstart',e=>{lastTouch=Date.now();down(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
  cv.addEventListener('touchmove',e=>{lastTouch=Date.now();move(e.touches[0].clientX);},{passive:true});
  cv.addEventListener('touchend',e=>{lastTouch=Date.now();const c=e.changedTouches[0];up(c.clientX,c.clientY);});

  window.addEventListener('resize',resize);
  window.House={resize};
  resize(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
