      from { opacity: 0; transform: translate(-50%, 20px); }

    /* 导出进度条 */

      from { width: 0% }
      to { width: 100% }

/* 自动抠图：从图片 URL 中去除接近白色的背景，返回带透明背景的 PNG dataURL
 * 算法：
 * 1. 把图片画到 canvas
 * 2. 从四个角开始 flood-fill 标记连通的浅色区域为背景（避免抠到主体内的白色）
 * 3. 边缘做 alpha 软过渡，避免锯齿
 * @param {string} src - 图片 URL/dataURL
 * @param {number} threshold - 颜色容差 0-100，默认 30（越大去得越狠）
 */
async function removeWhiteBackground(src, threshold = 30) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onerror = () => reject(new Error('图片加载失败'));
    img.onload = () => {
      try {
        // 限制最大尺寸避免超大图卡顿
        const maxDim = 1200;
        let w = img.naturalWidth,
          h = img.naturalHeight;
        if (Math.max(w, h) > maxDim) {
          const r = maxDim / Math.max(w, h);
          w = Math.round(w * r);
          h = Math.round(h * r);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const imageData = ctx.getImageData(0, 0, w, h);
        const data = imageData.data;
        const len = w * h;
        const visited = new Uint8Array(len);
        const queue = [];

        // 颜色相似度判断（基于 RGB 距离）
        const isLight = idx => {
          const r = data[idx * 4],
            g = data[idx * 4 + 1],
            b = data[idx * 4 + 2];
          // 亮度高且 RGB 接近（接近灰白）
          const lum = (r + g + b) / 3;
          const maxDiff = Math.max(Math.abs(r - g), Math.abs(g - b), Math.abs(r - b));
          return lum > 255 - threshold * 2.5 && maxDiff < threshold;
        };

        // 从四条边的所有像素开始 flood fill
        const seed = (x, y) => {
          const i = y * w + x;
          if (!visited[i] && isLight(i)) queue.push(i);
        };
        for (let x = 0; x < w; x++) {
          seed(x, 0);
          seed(x, h - 1);
        }
        for (let y = 0; y < h; y++) {
          seed(0, y);
          seed(w - 1, y);
        }
        while (queue.length) {
          const i = queue.pop();
          if (visited[i]) continue;
          visited[i] = 1;
          // 设为透明
          data[i * 4 + 3] = 0;
          const x = i % w,
            y = i / w | 0;
          // 4邻接扩散
          if (x > 0) {
            const n = i - 1;
            if (!visited[n] && isLight(n)) queue.push(n);
          }
          if (x < w - 1) {
            const n = i + 1;
            if (!visited[n] && isLight(n)) queue.push(n);
          }
          if (y > 0) {
            const n = i - w;
            if (!visited[n] && isLight(n)) queue.push(n);
          }
          if (y < h - 1) {
            const n = i + w;
            if (!visited[n] && isLight(n)) queue.push(n);
          }
        }

        // 边缘软过渡：邻接透明像素的不透明像素降低 alpha，消除锯齿
        const alpha = new Uint8Array(len);
        for (let i = 0; i < len; i++) alpha[i] = data[i * 4 + 3];
        for (let y = 1; y < h - 1; y++) {
          for (let x = 1; x < w - 1; x++) {
            const i = y * w + x;
            if (alpha[i] === 0) continue;
            let transparentNeighbors = 0;
            if (alpha[i - 1] === 0) transparentNeighbors++;
            if (alpha[i + 1] === 0) transparentNeighbors++;
            if (alpha[i - w] === 0) transparentNeighbors++;
            if (alpha[i + w] === 0) transparentNeighbors++;
            if (transparentNeighbors > 0) {
              data[i * 4 + 3] = Math.max(80, 255 - transparentNeighbors * 50);
            }
          }
        }
        ctx.putImageData(imageData, 0, 0);
        resolve(canvas.toDataURL('image/png'));
      } catch (e) {
        reject(e);
      }
    };
    img.src = src;
  });
}
